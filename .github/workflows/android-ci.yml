name: Android CI / CD (Auto APK Release)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deliver:
    name: Build & Deliver Signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare Signing Keystores (Automatic Fallback)
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEY_ALIAS" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Using custom release keystore from GitHub Secrets."
          else
            cp debug.keystore release-keystore.jks
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "No custom signing secrets required; automatically signing Release APK for direct installation."
          fi

      - name: Assemble Signed Debug & Release APKs
        env:
          SIGNING_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/FoxyVPN-Neu-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/FoxyVPN-Neu-release.apk
          ls -lh dist/

      - name: Clean Temporary Keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Upload Ready-to-Install APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Neu-Installable-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Automatically Publish Direct APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-apk' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'FoxyVPN Neu - Direct Install APK (Latest Build)' }}
          body: |
            ### FoxyVPN Neu (Bilingual EN/FA • Soft Neumorphism • Dynamic Island)
            - **Package ID:** `com.vauth.foxyvpn.neu` (Installs side-by-side with original FoxyVPN without conflict)
            - **Native Tunnel Engine:** `libhev-socks5-tunnel.so` bundled for `arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`
            - **Direct Installable Signed APKs:**
              - `FoxyVPN-Neu-release.apk` (Signed & Optimized Release APK)
              - `FoxyVPN-Neu-debug.apk` (Signed Debug APK)
          files: |
            dist/FoxyVPN-Neu-release.apk
            dist/FoxyVPN-Neu-debug.apk
          prerelease: false
          make_latest: true
